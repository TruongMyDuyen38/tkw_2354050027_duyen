<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ResiStay - Phần mềm Quản lý Khách sạn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Output CSS -->
    <link rel="stylesheet" href="./dist/output.css" />
  </head>

  <body class="bg-surface font-body text-ink antialiased">
    <!-- Accessibility Link -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-brand-600 focus:p-4 focus:text-white"
    >
      Bỏ qua đến nội dung chính
    </a>

    <header class="w-full border-b border-line bg-surface">
      <nav
        class="mx-auto flex h-[85px] w-[1280px] items-center justify-between py-[24px]"
        aria-label="Điều hướng chính"
      >
        <div class="flex items-center gap-[32px]">
          <!-- Logo -->
          <a
            href="index.html"
            class="flex h-[36px] w-[155.76px] items-center gap-[12px]"
            aria-label="ResiStay - Trang chủ"
          >
            <!-- Logo Icon -->
            <svg
              class="h-[32.62px] w-[29.76px] shrink-0"
              viewBox="0 0 40 40"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="40" height="40" rx="10" fill="#3A6F8F" />
              <path d="M20 9L9 18H12V29H28V18H31L20 9Z" fill="#F47D24" />
              <path d="M16 22H24V29H16V22Z" fill="#FFFFFF" />
            </svg>

            <span
              class="font-display text-[24px] font-semibold leading-[150%] tracking-tight text-ink"
            >
              ResiStay
            </span>
          </a>

          <!-- Menu Links -->
          <ul class="flex items-center gap-[32px]">
            <li>
              <a
                href="#hero"
                class="font-body text-[16px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
              >
                Trang chủ
              </a>
            </li>

            <li>
              <a
                href="#features"
                class="font-body text-[16px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
              >
                Tính năng
              </a>
            </li>

            <li>
              <a
                href="#brands"
                class="font-body text-[16px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
              >
                Đối tác
              </a>
            </li>

            <li>
              <a
                href="#testimonials"
                class="font-body text-[16px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
              >
                Đánh giá
              </a>
            </li>

            <li>
              <a
                href="#faq"
                class="font-body text-[16px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
              >
                Liên hệ
              </a>
            </li>
          </ul>
        </div>


        <div class="flex items-center gap-[16px]">
          <a
            href="#login"
            class="font-body text-[14px] font-medium leading-[150%] tracking-tight text-ink transition-colors hover:text-brand-600"
          >
            Đăng nhập
          </a>

          <a
            href="#cta"
            class="btn btn-primary rounded-card font-body text-[14px] font-medium leading-[150%] tracking-tight px-[12px] py-[8px]"
          >
            Dùng thử miễn phí
          </a>
        </div>
      </nav>
    </header>

  
    <main id="main-content">

      <section
        id="hero"
        class="w-full bg-surface py-[64px]"
        aria-labelledby="hero-title"
      >
        <div
          class="mx-auto flex h-[416px] w-[1280px] items-center justify-between gap-[96px]"
        >
          <div class="flex w-[736px] flex-col items-start gap-[40px]">
            <div class="flex w-[736px] flex-col items-start gap-[24px]">
              <!-- Heading -->
              <h1
                id="hero-title"
                class="font-display text-[52px] font-extrabold leading-[56px] -tracking-[0.03em] text-ink"
              >
                Giải pháp quản lý
                <br />
                khách sạn toàn diện.
              </h1>

             

            <!-- Buttons -->
            <div class="flex items-center gap-[16px]">
              <a
                href="#cta"
                class="btn btn-primary rounded-card font-body text-[16px] font-medium leading-[150%] h-[48px] px-[20px] py-[12px] whitespace-nowrap"
              >
                Bắt đầu dùng thử
              </a>

              <a
                href="#features"
                class="btn btn-outline rounded-card font-body text-[16px] font-medium leading-[150%] h-[48px] px-[20px] py-[12px] whitespace-nowrap"
              >
                Xem tính năng
              </a>
            </div>
          </div>

          
          <figure class="flex items-center justify-between">
            <img
              src="./assets/img/hero-hotel.png"
              alt="Giao diện phần mềm quản lý khách sạn ResiStay"
              class="h-[416px] w-[532px] object-contain"
            />
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
